<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChangarroWEB - Panel Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
    <script src="admin.js" defer></script>
</head>
<body>
    <!-- LOGIN -->
    <div id="login-container" class="login-container active">
        <div class="login-box">
            <div class="login-flex">
                
                <div class="login-column">
                    <h1>🔐 INICIAR SESIÓN</h1>
                    <p>Bienvenido al ChangarroWEB</p>
                    <form onsubmit="iniciarSesion(event)">
                        <div class="form-group">
                            <label for="usuario">Usuario:</label>
                            <input type="text" id="usuario" placeholder="juanperez123" required>
                        </div>
                        <div class="form-group">
                            <label for="contraseña">Contraseña:</label>
                            <input type="password" id="contraseña" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn-login">Iniciar Sesión</button>
                    </form>
                </div>

                <div class="login-divider"></div>

                <div class="login-column">
                    <h1 style="color: #f4a230; text-align: center; font-size: 2em; margin-bottom: 10px;">✨ REGISTRARSE</h1>
                    <p style="text-align: center; color: #cccccc; margin-bottom: 25px;">¿Eres nuevo cliente?</p>
                    <form onsubmit="registrarUsuario(event)">
                        <div class="form-group">
                            <label for="reg-nombre">Nombre Completo:</label>
                            <input type="text" id="reg-nombre" placeholder="Ej. Juan Pérez" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-usuario">Nombre de Usuario:</label>
                            <input type="text" id="reg-usuario" placeholder="juanperez123" required>
                        </div>
                        <div class="form-group">
                            <label for="reg-contraseña">Contraseña:</label>
                            <input type="password" id="reg-contraseña" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn-login" style="background: linear-gradient(135deg, #4caf50 0%, #45a049 100%); color: white;">Crear Cuenta</button>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- PANEL ADMIN -->
    <div id="admin-container" class="admin-container">
        <header class="admin-header">
            <h1>🎨 ChangarroWEB - Panel de Control</h1>
            <button class="btn-logout" onclick="cerrarSesion()">🚪 Cerrar Sesión</button>
        </header>

        <nav class="admin-nav">
            <button class="nav-btn active" onclick="mostrarSeccion('dashboard')">📊 Dashboard</button>
            <button class="nav-btn" onclick="mostrarSeccion('productos')">📦 Productos</button>
            <button class="nav-btn" onclick="mostrarSeccion('ordenes')">🛒 Órdenes Recibidas</button>
        </nav>

        <!-- DASHBOARD -->
        <section id="dashboard" class="admin-section active">
            <h2>📊 Dashboard</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total de Productos</h3>
                    <p class="stat-numero" id="total-productos">0</p>
                </div>
                <div class="stat-card">
                    <h3>Órdenes Recibidas</h3>
                    <p class="stat-numero" id="total-ordenes">0</p>
                </div>
                <div class="stat-card">
                    <h3>Ingresos</h3>
                    <p class="stat-numero" id="total-ingresos">$0.00</p>
                </div>
                <div class="stat-card">
                    <h3>Stock Bajo</h3>
                    <p class="stat-numero alerta" id="stock-bajo">0</p>
                </div>
            </div>
        </section>

        <!-- GESTIÓN DE PRODUCTOS -->
        <section id="productos" class="admin-section">
            <div class="productos-header">
                <h2>📦 Gestión de Productos</h2>
                <button class="btn-primario" onclick="mostrarFormularioProducto()">➕ Nuevo Producto</button>
            </div>

            <!-- Formulario de producto -->
            <div id="formulario-producto" class="formulario-producto hidden">
                <h3 id="formulario-titulo">Agregar Nuevo Producto</h3>
                <form onsubmit="guardarProducto(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="prod-titulo">Título:</label>
                            <input type="text" id="prod-titulo" required>
                        </div>
                        <div class="form-group">
                            <label for="prod-type">Tipo:</label>
                            <select id="prod-type" required>
                                <option value="">Selecciona tipo</option>
                                <option value="Poster">Poster</option>
                                <option value="Postal">Postal</option>
                                <option value="Mini Poster">Mini Poster</option>
                                <option value="Botón">Botón</option>
                                <option value="Sticker">Sticker</option>
                                <option value="Pin">Pin</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="prod-category">Categoría:</label>
                            <select id="prod-category" required>
                                <option value="">Selecciona categoría</option>
                                <option value="Anime">Anime</option>
                                <option value="Peliculas">Películas</option>
                                <option value="Animalitos">Animalitos</option>
                                <option value="Paisajes">Paisajes</option>
                                <option value="Vehiculos">Vehículos</option>
                                <option value="Series">Series</option>
                                <option value="Caricaturas">Caricaturas</option>
                                <option value="Musica">Música</option>
                                <option value="Videojuegos">Videojuegos</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="prod-precio">Precio:</label>
                            <input type="number" id="prod-precio" min="0" step="0.01" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="prod-stock">Stock:</label>
                            <input type="number" id="prod-stock" min="0" required>
                        </div>
                    </div>

                    <div class="form-acciones">
                        <button type="submit" class="btn-primario">💾 Guardar Producto</button>
                        <button type="button" class="btn-secundario" onclick="cancelarFormulario()">❌ Cancelar</button>
                    </div>
                </form>
            </div>

            <!-- Lista de productos -->
            <div id="lista-productos" class="lista-productos"></div>
        </section>

        <!-- ÓRDENES RECIBIDAS -->
        <section id="ordenes" class="admin-section">
            <h2>🛒 Órdenes Recibidas</h2>
            <div id="lista-ordenes" class="lista-ordenes"></div>
        </section>
    </div>
</body>
</html>
